services:
  app:
    image: mcr.microsoft.com/devcontainers/rust:2-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/shared_rencode

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shared_rencode
    ports:
      - "5432:5432"